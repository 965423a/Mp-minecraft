set timeout=10
set default=0
# 诊断:GRUB 输出镜像到 COM1 + 打印视频模式列表(排障用,最终版会移除)
insmod serial
serial --unit=0 --speed=115200
terminal_output serial
videoinfo
# 视频策略:UEFI 分支完全照抄 Ubuntu/Kali 在 Hyper-V Gen2 上的成功配置:
# gfxmode=auto(用固件当前 GOP 模式)+ gfxpayload=keep(直接沿用给内核)。
# 之前显式请求 1024x768/640x480 在 Hyper-V 固件上都报
# "no suitable video mode found" -> 无 framebuffer tag -> 黑屏。
# 注意:gfxpayload 只接受单值(keep/text/auto/WxH),不支持逗号列表。
set gfxmode=auto
set gfxpayload=keep
if [ "${grub_platform}" != "efi" ]; then
    # BIOS core.img(grub-mkrescue 模板)不内嵌视频驱动,必须显式加载,
    # 否则 VBE set mode 失败 -> GRUB 传伪 tag(0xB8000),无真实 framebuffer。
    # BIOS 下固件当前模式是文本,keep/auto 不会切图形,需显式请求分辨率。
    insmod all_video
    set gfxmode=1024x768,800x600,640x480
    set gfxpayload=1024x768
fi
if loadfont unicode ; then
    set color_normal=white/black
    set menu_color_highlight=black/light-gray
    terminal_output gfxterm
else
    terminal_output console
fi
# 诊断:菜单前打印视频驱动与可用模式(看串口/屏幕,排障用)
videoinfo
set menu_color_normal=white/black
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
menuentry "Mp-minecraft System" {
    multiboot2 /boot/mcs-kernel
    boot
}
menuentry "Mp-minecraft System (2-node NUMA debug)" {
    multiboot2 /boot/mcs-kernel "numa=2;0:0-1024;1:1024-2048"
    boot
}