set timeout=10
set default=0
set timeout=10
set default=0
# 显式请求分辨率:GRUB 会在启动时激活 video_fb 并切换模式,
# multiboot2 才会携带 framebuffer tag(Hyper-V Gen2 无 VGA 文本,必须走 framebuffer)
set gfxpayload=1024x768,1024x768,auto
if [ "${grub_platform}" = "efi" ]; then
    # gfxmode 让 gfxterm 也切到 1024x768(Hyper-V Gen2 的 GOP 支持该分辨率)
    set gfxmode=1024x768
    terminal_output gfxterm
else
    terminal_output console
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
menuentry "Mp-minecraft System (BIOS mode recommended)" {
    multiboot2 /boot/mcs-kernel
    boot
}
menuentry "Mp-minecraft System (2-node NUMA debug)" {
    multiboot2 /boot/mcs-kernel "numa=2;0:0-1024;1:1024-2048"
    boot
}